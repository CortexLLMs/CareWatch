# CI — vérifie à chaque push / pull request que le projet compile.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci
        working-directory: frontend

      - name: Build de production
        run: npm run build
        working-directory: frontend

  backend:
    name: Backend (vérification syntaxique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: node --check sur chaque module
        run: |
          set -e
          for f in backend/*.js; do
            node --check "$f"
            echo "OK  $f"
          done
